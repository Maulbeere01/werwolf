syntax = "proto3";

package werewolf;

import "google/protobuf/empty.proto";
 import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.werewolf.grpc";

/* * auth:
    - user_id is not sent in request messages
    - the client attaches the login token to gRPC metadata for every call
    - server-side interceptor validates the token and identifies the user
    - the service implementation retrieves the user_id securely from the context
 * * error handling:
    - we use native gRPC status codes (OK, NOT_FOUND, PERMISSION_DENIED, etc.)
    - for methods that don't need to return data on success, we use google.protobuf.Empty
    - if a call returns without an exception, it is considered successful
 */

service UserService {
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc Register (RegisterRequest) returns (google.protobuf.Empty);
  rpc GetProfile (ProfileRequest) returns (UserProfile);
  rpc UpdateAvatar (UpdateAvatarRequest) returns (UserProfile);

  // rpc GetGameHistory (GameHistoryRequest) returns (GameHistoryResponse);
  // rpc BuySkin (SkinRequest) returns (google.protobuf.Empty);
}

service GameService {
  rpc CreateLobby (CreateLobbyRequest) returns (LobbyInfo);
  rpc JoinLobby (JoinRequest) returns (LobbyInfo);
  rpc StartGame (StartGameRequest) returns (google.protobuf.Empty); 
  
  rpc SubscribeToGame (SubscribeRequest) returns (stream GameUpdate);
  rpc PerformAction (GameAction) returns (google.protobuf.Empty);
  rpc RequestPause (PauseRequest) returns (google.protobuf.Empty);
  rpc ResumeGame (PauseRequest) returns (google.protobuf.Empty);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  WEREWOLF = 1;
  VILLAGER = 2;
  SEER = 3;
  WITCH = 4;
  FOX = 5;
  VILLAGE_IDIOT = 6;
  HUNTER = 7;
  CUPID = 8;
  SABOTEUR = 9;
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  LOBBY = 1;
  NIGHT_START = 2;
  NIGHT_WEREWOLVES = 3;
  NIGHT_SEER = 4;
  NIGHT_WITCH = 5;
  NIGHT_FOX = 6;
  NIGHT_SABOTEUR = 7;
  DAY_RESULT = 8;
  DAY_DISCUSSION = 9;
  DAY_VOTING = 10;
  HUNTER_REVENGE = 11;
  GAME_END = 12;
  NIGHT_CUPID = 13;
}

enum EliminationCause {
  CAUSE_UNSPECIFIED = 0;
  KILLED_BY_WEREWOLVES = 1;
  KILLED_BY_WITCH = 2;
  VOTED_OUT = 3;
  CAUSE_HUNTER_REVENGE = 4;
  CAUSE_HEARTBREAK = 5;
}

// user

message UserProfile {
  string user_id = 1;
  string username = 2;
  int32 score = 3;
  string avatar = 4; // filename of the chosen built-in profile picture, empty if unset
  int32 games_played = 5;
  int32 games_won_werewolf = 6;  // games won while holding the WEREWOLF role
  int32 games_won_villager = 7;  // games won while holding any non-WEREWOLF role
  int32 games_lost = 8;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  UserProfile profile = 2;
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message ProfileRequest {
  string target_user_id = 1; // empty for own profile
}

message UpdateAvatarRequest {
  string avatar = 1; // filename of one of the built-in profile pictures
}

// lobby

message RoleCount {
  Role role = 1;
  int32 count = 2;
}

message LobbySettings {
  int32 max_players = 1;
  repeated RoleCount roles = 2;
  int32 discussion_time_seconds = 3;
}

message CreateLobbyRequest {
  LobbySettings settings = 1;
}

message JoinRequest {
  string lobby_code = 1;
}

message StartGameRequest {
  string lobby_code = 1;
}

message LobbyInfo {
  string lobby_code = 1;
  repeated PlayerStatus players = 2;
  bool can_start = 3;
  string host_id = 4;
  LobbySettings settings = 5;
}

// gameplay

message SubscribeRequest {
  string lobby_code = 1;
}

message GameUpdate {
  Phase current_phase = 1;
  reserved 2, 3, 5, 6;
  repeated PlayerStatus players = 4;
  Role winning_team = 7;

  // empty in shared broadcasts, populated in personalised snapshots
  Role your_role = 8;
  ActionPrompt open_prompt = 9;       // set when the recipient must act this phase
  ActionResult your_results = 10;     // private outcome of the last action (seer reveal, fox result)
  PublicAnnouncement announcement = 11;
  google.protobuf.Timestamp phase_ends_at = 12;
  PauseState pause = 13;

  // true only for the player the saboteur silenced: they sit out this day's
  // discussion and vote (their day vote is discarded server-side)
  bool you_are_sabotaged = 14;

  // set only in a lover's own snapshot: the id of the player they are in love
  // with (empty for everyone else). Lets each lover privately know their partner.
  string lover_partner_id = 15;

  // true only for a just-killed hunter who still owes a revenge shot, keeps the
  // client on the revenge screen instead of latching the death screen
  bool you_must_take_revenge = 16;
}

message PlayerStatus {
  string id = 1;
  string name = 2;
  bool is_alive = 3;
  bool has_voted = 4;
  string voted_for_target_id = 5; // masked by backend
  Role role = 6;                  // masked by backend
  bool is_host = 7;
  string avatar = 8; // filename of the chosen built-in profile picture, empty if unset
}

message GameAction {
  string lobby_code = 1;
  oneof action {
    VoteAction vote = 2;
    WitchAction witch = 3;
    SeerAction seer = 4;
    FoxAction fox = 5;
    HunterAction hunter = 6;
    CupidAction cupid = 7;
    SaboteurAction saboteur = 8;
  }
}

message CupidAction {
  string player1_id = 1;
  string player2_id = 2;
}

message VoteAction {
  string target_id = 1;
}

message WitchAction {
  bool heal_target = 1;
  string poison_target_id = 2;
}

message SeerAction {
  string target_id = 1;
}

message FoxAction {
  repeated string target_ids = 1;
}

message SaboteurAction {
  string target_id = 1;
}

message HunterAction {
  string target_id = 1;
}

// action prompts: tell the client to render a role specific action

message ActionPrompt {
  oneof prompt {
    WerewolfPrompt werewolf = 1;
    SeerPrompt     seer     = 2;
    WitchPrompt    witch    = 3;
    FoxPrompt      fox      = 4;
    HunterPrompt   hunter   = 5;
    SaboteurPrompt saboteur = 6;
    CupidPrompt    cupid    = 7;
  }
}

message WerewolfPrompt {
  repeated string candidate_ids = 1;
}

message SeerPrompt {
  repeated string candidate_ids = 1;
}

message WitchPrompt {
  string attacked_player_id = 1;
  bool has_heal_potion = 2;
  bool has_poison_potion = 3;
}

message FoxPrompt {
  repeated string candidate_ids = 1;
}

message HunterPrompt {
  repeated string candidate_ids = 1;
}

message SaboteurPrompt {
  repeated string candidate_ids = 1;
}

message CupidPrompt {
  repeated string candidate_ids = 1;
}

// action results

message ActionResult {
  oneof result {
    SeerReveal seer_reveal = 1;
    FoxReveal  fox_reveal  = 2;
  }
}

message SeerReveal {
  string target_id = 1;
  bool is_werewolf = 2;
}

message FoxReveal {
  bool any_werewolf_found = 1;
}

// public announcements

message PublicAnnouncement {
  oneof event {
    NightDeathEvent  night_death  = 1;
    NoDeathEvent     no_death     = 2;
    VoteResultEvent  vote_result  = 3;
    HunterShotEvent  hunter_shot  = 4;
    GameEndEvent     game_end     = 5;
  }
}

message NightDeathEvent {
  repeated PlayerDeath deaths = 1;
}

message PlayerDeath {
  string player_id = 1;
  EliminationCause cause = 2;
}

message NoDeathEvent {}

message VoteResultEvent {
  string eliminated_player_id = 1; // empty when tied
  bool tied = 2;
  repeated string also_died_ids = 3;
}

message HunterShotEvent {
  string shooter_id = 1;
  string target_id = 2;
}

message GameEndEvent {
  Role winning_team = 1;
}

// pause

message PauseRequest {
  string lobby_code = 1;
}

message PauseState {
  bool is_paused = 1;
  int32 vote_count = 2;
  int32 votes_needed = 3;
  bool you_voted = 4;
  google.protobuf.Timestamp paused_until = 5;
}
